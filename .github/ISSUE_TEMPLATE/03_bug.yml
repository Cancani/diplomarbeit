name: "Bug"
description: "Fehlverhalten mit Reproduktion, Analyse und Behebung"
title: "BUG: "
labels: ["bug"]
body:
  - type: textarea
    id: beobachtung
    attributes:
      label: Beobachtetes Verhalten
    validations:
      required: true

  - type: textarea
    id: erwartet
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduktion
      description: "Schritte, Umgebung, Plattform (On-Prem oder Cloud), Lauf-ID"
    validations:
      required: true

  - type: textarea
    id: analyse
    attributes:
      label: Analyse und Ursache
      description: "Wird während der Bearbeitung ergänzt, dient als Nachweis der Problemdiagnose"

  - type: textarea
    id: behebung
    attributes:
      label: Lösung und Nachweis
      description: "Was wurde geändert, wie wurde verifiziert"
