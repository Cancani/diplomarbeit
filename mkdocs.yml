site_name: Diplomarbeit ITCNE24 Agentenbasierte Hybrid-Cloud-Bereitstellung
site_description: Proof of Concept zur plattformübergreifenden Bereitstellung von Lernumgebungen mit Kubernetes, KubeVirt und MCP
site_author: Efekan Demirci
site_url: https://cancani.com/diplomarbeit/

repo_name: Cancani/diplomarbeit
repo_url: https://github.com/Cancani/diplomarbeit
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark Mode aktivieren
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light Mode aktivieren
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/style.css

extra_javascript:
  - javascripts/diagram-zoom.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Start: index.md
  - Dokumentation: dokumentation.md
  - Journal: journal.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cancani
  generator: false

copyright: Efekan Demirci, ITCNE24, TBZ Höhere Fachschule
