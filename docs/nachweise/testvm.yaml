apiVersion: v1
kind: Namespace
metadata:
  name: diplomarbeit
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: testvm
  namespace: diplomarbeit
  labels:
    lauf: testlauf-01
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: testvm-disk
      spec:
        storage:
          resources:
            requests:
              storage: 10Gi
          storageClassName: microk8s-hostpath
          accessModes:
            - ReadWriteOnce
        source:
          http:
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  template:
    metadata:
      labels:
        kubevirt.io/domain: testvm
        app: testvm
        lauf: testlauf-01
    spec:
      domain:
        cpu:
          cores: 2
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: testvm-disk
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: testvm
              users:
                - name: ubuntu
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  lock_passwd: false
                  plain_text_passwd: diplomarbeit
                  shell: /bin/bash
              write_files:
                - path: /etc/systemd/system/testdienst.service
                  content: |
                    [Unit]
                    Description=Testdienst fuer den Readiness-Check
                    After=network-online.target
                    [Service]
                    ExecStart=/usr/bin/python3 -m http.server 8080 --directory /var/www
                    Restart=always
                    [Install]
                    WantedBy=multi-user.target
              runcmd:
                - mkdir -p /var/www
                - echo "testvm bereit" > /var/www/index.html
                - systemctl daemon-reload
                - systemctl enable --now testdienst.service
---
apiVersion: v1
kind: Service
metadata:
  name: testvm-http
  namespace: diplomarbeit
spec:
  type: NodePort
  selector:
    app: testvm
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
