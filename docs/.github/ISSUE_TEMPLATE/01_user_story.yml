name: "User Story"
description: "User Story mit Akzeptanzkriterien, Definition of Done und Nachweisen"
title: "USxx: "
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "Als <Rolle> möchte ich <Ziel>, damit <Nutzen>."
      placeholder: "Als Dozent möchte ich eine Lernumgebung aus einer einzigen Definition erstellen lassen, damit ich sie nicht pro Plattform neu aufbauen muss."
    validations:
      required: true

  - type: dropdown
    id: epic
    attributes:
      label: Epic
      options:
        - "E1 Projektinitialisierung"
        - "E2 IST-Aufnahme und Ausgangsmessung"
        - "E3 On-Prem Plattform"
        - "E4 Public Cloud"
        - "E5 Fachmodell"
        - "E6 Agent"
        - "E7 MCP-Adapter"
        - "E8 Validierung und Messung"
        - "E9 Bewertung und Vergleich"
        - "E10 Betrieb und Schulung"
        - "E11 Projektabschluss"
    validations:
      required: true

  - type: dropdown
    id: points
    attributes:
      label: Story Points
      options: ["1", "2", "3", "5", "8", "13"]
    validations:
      required: true

  - type: textarea
    id: dor
    attributes:
      label: Definition of Ready
      description: "Was muss vor dem Start geklärt sein"
      value: |
        - [ ] Nutzen und Ziel sind formuliert
        - [ ] Akzeptanzkriterien sind prüfbar
        - [ ] Abhängigkeiten und Vorbedingungen sind benannt
        - [ ] Story Points geschätzt, Epic und Sprint zugeordnet

  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      description: "Prüfbare Kriterien, je eine Checkbox"
      value: |
        - [ ] Kriterium 1
        - [ ] Kriterium 2
        - [ ] Kriterium 3
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - [ ] Akzeptanzkriterien erfüllt
        - [ ] Code oder Konfiguration committed und über Pull Request nach main gemerged
        - [ ] Dokumentationsabschnitt geschrieben oder aktualisiert
        - [ ] Nachweis abgelegt (Screenshot, Logauszug oder Messwert) und in der Doku verlinkt
        - [ ] Wiederholbar: der Schritt lässt sich anhand der Doku ein zweites Mal ausführen
        - [ ] Keine Geheimnisse im Repository
        - [ ] Issue im Board auf Done verschoben
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Nachweise
      description: "Links oder Pfade zu Doku, Screenshots, Messprotokollen, Actions Runs"
      placeholder: |
        Doku Abschnitt:
        Screenshot:
        Messprotokoll:
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: Risiken und offene Punkte
      placeholder: "Bezug zu einem Risiko aus der Risikomatrix, zum Beispiel R01"
    validations:
      required: false
