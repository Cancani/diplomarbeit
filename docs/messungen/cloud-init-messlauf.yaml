#cloud-config
write_files:
  - path: /var/www/index.html
    content: |
      lernumgebung bereit
  - path: /etc/systemd/system/testdienst.service
    content: |
      [Unit]
      Description=Testdienst fuer den Readiness-Check
      After=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 -m http.server 8080 --directory /var/www
      Restart=always

      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now testdienst.service
